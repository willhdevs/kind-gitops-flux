apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 88.3.0
  interval: 30m
  releaseName: monitoring
  timeout: 10m
  values:
    grafana:
      additionalDataSources:
        - access: proxy
          editable: false
          jsonData:
            configMode: classic
            defaultDatabase: flows
            host: clickhouse.telemetry.svc.cluster.local
            port: 9000
            protocol: native
            username: grafana_reader
          name: ClickHouse Telemetry
          type: grafana-clickhouse-datasource
          uid: clickhouse-telemetry
      plugins:
        - grafana-clickhouse-datasource@4.20.0
      service:
        type: LoadBalancer
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              storageClassName: standard
