apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: "Network"

configMapGenerator:
  - name: grafana-dashboard-network-overview
    files:
      - network-overview.json
  - name: grafana-dashboard-flow-explorer
    files:
      - flow-explorer.json
