apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-bootstrap
  namespace: telemetry
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        telemetry.willh.dev/component: clickhouse-bootstrap
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              until clickhouse-client \
                --host clickhouse.telemetry.svc.cluster.local \
                --port 9000 \
                --user default \
                --query "SELECT 1"; do
                sleep 5
              done

              clickhouse-client \
                --host clickhouse.telemetry.svc.cluster.local \
                --port 9000 \
                --user default \
                --multiquery < /bootstrap/01-flows.sql
          command:
            - /bin/sh
            - -ec
          image: clickhouse/clickhouse-server:26.3.17.110
          imagePullPolicy: IfNotPresent
          name: bootstrap
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /bootstrap
              name: bootstrap
              readOnly: true
      restartPolicy: OnFailure
      volumes:
        - configMap:
            name: clickhouse-bootstrap
          name: bootstrap
