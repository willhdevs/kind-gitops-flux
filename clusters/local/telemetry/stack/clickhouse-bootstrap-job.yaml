apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-bootstrap
  namespace: telemetry
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        telemetry.willh.dev/component: clickhouse-bootstrap
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              until clickhouse-client \
                --host clickhouse.telemetry.svc.cluster.local \
                --port 9000 \
                --user default \
                --query "SELECT 1"; do
                sleep 5
              done

              # The application accounts are SQL-managed access entities stored
              # in ClickHouse Keeper. Reload first so removed users_xml accounts
              # cannot conflict with the Keeper-backed accounts created below.
              QUERY="SELECT count() FROM system.users WHERE name IN ('flows_writer', 'grafana_reader') AND storage = 'users_xml'"
              until [ "$(clickhouse-client \
                --host clickhouse.telemetry.svc.cluster.local \
                --port 9000 \
                --user default \
                --query "$QUERY")" = "0" ]; do
                clickhouse-client \
                  --host clickhouse.telemetry.svc.cluster.local \
                  --port 9000 \
                  --user default \
                  --query "SYSTEM RELOAD USERS"
                sleep 5
              done

              clickhouse-client \
                --host clickhouse.telemetry.svc.cluster.local \
                --port 9000 \
                --user default \
                --multiquery < /bootstrap/01-flows.sql
          command:
            - /bin/sh
            - -ec
          image: clickhouse/clickhouse-server:26.3.17.110
          imagePullPolicy: IfNotPresent
          name: bootstrap
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /bootstrap
              name: bootstrap
              readOnly: true
      restartPolicy: OnFailure
      volumes:
        - configMap:
            name: $(CLICKHOUSE_BOOTSTRAP_CONFIG)
          name: bootstrap
