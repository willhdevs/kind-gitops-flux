apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 1h
  path: ./clusters/local/clickhouse-operator/stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
